<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Chat Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #121212; color: white; display: flex; flex-direction: column; height: 100vh; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { background: #1e1e1e; padding: 12px; border-radius: 12px; max-width: 75%; width: fit-content; border: 1px solid #333; }
        .msg .user { font-weight: bold; color: #00ff88; font-size: 0.85em; margin-bottom: 5px; }
        .chat-img { max-width: 100%; max-height: 250px; border-radius: 8px; margin-top: 5px; display: block; }
        #input-area { display: flex; align-items: center; padding: 15px; background: #1e1e1e; border-top: 1px solid #333; gap: 10px; }
        #message-input { flex: 1; padding: 12px; border: 1px solid #444; background: #2a2a2a; color: white; border-radius: 20px; outline: none; }
        .file-label { background: #333; color: white; padding: 10px 15px; border-radius: 50%; cursor: pointer; font-weight: bold; font-size: 1.2em; display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; }
        .file-label:hover { background: #444; }
        #file-input { display: none; }
        #send-btn { background: #00ff88; color: #121212; border: none; padding: 12px 25px; border-radius: 20px; cursor: pointer; font-weight: bold; height: 42px; }
        #send-btn:hover { background: #00cc6e; }
        #status { padding: 5px 20px; background: #222; font-size: 0.8em; color: #aaa; }
        #preview-container { display: none; padding: 10px 20px; background: #1a1a1a; border-top: 1px solid #333; font-size: 0.85em; color: #00ff88; }
    </style>
</head>
<body>

    <div id="status">Connecting...</div>
    <div id="chat-window"></div>
    <div id="preview-container">📎 Image ready to send...</div>
    
    <div id="input-area">
        <label for="file-input" class="file-label">+</label>
        <input type="file" id="file-input" accept="image/*">
        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>

    <script>
        let username = prompt("Enter nickname:") || "User_" + Math.floor(Math.random() * 1000);
        
        // Free, public websocket channel unique to your project room
        const socket = new WebSocket('wss://://piesocket.com'); 

        const chatWindow = document.getElementById('chat-window');
        const messageInput = document.getElementById('message-input');
        const fileInput = document.getElementById('file-input');
        const sendBtn = document.getElementById('send-btn');
        const statusDiv = document.getElementById('status');
        const previewContainer = document.getElementById('preview-container');

        let attachedImageBase64 = ""; 

        socket.onopen = () => { statusDiv.innerText = "Connected as: " + username; statusDiv.style.color = "#00ff88"; };
        socket.onerror = () => { statusDiv.innerText = "Network connection failed."; statusDiv.style.color = "#ff4444"; };
        socket.onclose = () => { statusDiv.innerText = "Disconnected."; statusDiv.style.color = "#ff4444"; };

        // Handle incoming messages instantly
        socket.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.user && data.user !== username) { // Don't double-display your own messages
                    displayMessage(data.user, data.message, data.image);
                }
            } catch(e) {}
        };

        // File handler
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxW = 300; 
                    const scale = maxW / img.width;
                    canvas.width = maxW;
                    canvas.height = img.height * scale;
                    
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    attachedImageBase64 = canvas.toDataURL('image/jpeg', 0.5); 
                    previewContainer.style.display = "block";
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function sendMessage() {
            const text = messageInput.value.trim();
            
            if ((text !== "" || attachedImageBase64 !== "") && socket.readyState === WebSocket.OPEN) {
                const payload = { user: username, message: text, image: attachedImageBase64 };
                
                socket.send(JSON.stringify(payload));
                displayMessage("You", text, attachedImageBase64); // Show on your screen instantly
                
                messageInput.value = "";
                attachedImageBase64 = "";
                previewContainer.style.display = "none";
                fileInput.value = "";
            }
        }

        function displayMessage(user, msgText, imgData) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('msg');
            if(user === "You") msgDiv.style.alignSelf = "flex-end";
            
            const userDiv = document.createElement('div');
            userDiv.classList.add('user');
            userDiv.innerText = user;
            msgDiv.appendChild(userDiv);

            if(msgText) {
                const textDiv = document.createElement('div');
                textDiv.innerText = msgText;
                msgDiv.appendChild(textDiv);
            }

            if(imgData) {
                const imgTag = document.createElement('img');
                imgTag.src = imgData;
                imgTag.classList.add('chat-img');
                msgDiv.appendChild(imgTag);
            }
            
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
